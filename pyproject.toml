[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cg-data"
version = "0.1.0"
description = "Chart Guy data tools: a careful layer over lse-data with inclusive dates, no Sunday candles and event studies with sample sizes."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Muzamil (Chart Guy / LIARG Analyst)" }]
requires-python = ">=3.9"
dependencies = ["lse-data>=0.14"]

[project.optional-dependencies]
pandas = ["pandas"]

[project.scripts]
cgdata = "chartguy_data.cli:main"

[project.urls]
Repository = "https://github.com/muzamil-glitch/cg-data"

[tool.setuptools]
packages = ["chartguy_data"]
